[platformio]
default_envs = esp32-s3-es3c28p
; Sound clips are the files in sounds/, uploaded as a LittleFS image:
;   pio run -t uploadfs --upload-port /dev/cu.usbmodemXXXX
; (the board also reads clips from a FAT32 microSD when present)
data_dir = sounds

; ---------------------------------------------------------------------------
; LCDWIKI ES3C28P: ESP32-S3 + 2.8" 240x320 ILI9341V SPI, FT6336G capacitive
; touch, ES8311 codec + FM8002E amp, WS2812 RGB LED, microSD (SDIO), TP4054
; LiPo charger, battery ADC on GPIO9. 240x320 portrait UI.
; Console goes over the native USB-Serial-JTAG (usbmodem port).
; Always pass --upload-port explicitly: /dev/cu.usbmodem14xxx
; (manual download-mode fallback: hold BOOT -> tap RST -> release BOOT).
; ---------------------------------------------------------------------------
[env:esp32-s3-es3c28p]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
build_flags =
    -D BOARD_ES3C28P
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -std=gnu++17
    -O2
lib_deps =
    lvgl/lvgl@8.4.0
    lovyan03/LovyanGFX@^1.1.16
