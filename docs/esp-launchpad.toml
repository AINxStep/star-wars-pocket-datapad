# ESP Launchpad quick-flash config — used by the "web flasher" link in the
# firmware README and flashing guide. Point ESP Launchpad at this file with
# ?flashConfigURL=<raw URL of this file>
esp_toml_version = 1.0

# Merged single-image firmware (bootloader+partitions+app), flashed at 0x0.
# Hosted on GitHub Pages (sends CORS headers, required by the web flasher);
# the Pages workflow stages it from the latest release asset into /flash/.
firmware_images_url = "https://ainxstep.github.io/star-wars-pocket-datapad/flash/"

supported_apps = ["star-wars-datapad"]

[star-wars-datapad]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "es3c28p-firmware.bin"
# NOTE: this file is also copied to simulator/web/flash/ by the Pages
# workflow; keep firmware_images_url pointing at the Pages /flash/ path.
description = "Star Wars datapad firmware for the ES3C28P all-in-one module (merged image, flashes at 0x0)"
readme.text = "https://raw.githubusercontent.com/AINxStep/star-wars-pocket-datapad/main/firmware/README.md"
